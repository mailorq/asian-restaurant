# bootstrap: cp compose.override.example.yaml compose.override.yaml
# the real compose.override.yaml is gitignored and tuned per machine

services:
  backend:
    build:
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_COOKIE_SECURE: "0"
      DJANGO_MAKEMIGRATIONS: "1"
    # the dev target runs as root over the host checkout and needs the default capabilities to write there
    cap_drop: !reset []
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      target: dev
    # the vite server runs as root over the host checkout and writes its cache and npm logs outside /tmp
    read_only: false
    cap_drop: !reset []
    mem_limit: 1g
    pids_limit: 256
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  # the management ui for local work; a port is published only through a network that is not internal
  rabbitmq:
    ports:
      - "127.0.0.1:15672:15672"
    networks: [dev_host]

networks:
  dev_host:
