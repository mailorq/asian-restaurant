name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# no job needs more than reading the checkout
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asian
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asian_restaurant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        # guest is loopback-only, and a health probe run as root writes an .erlang.cookie the server cannot read; the transport test waits for the port itself
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports: ["5672:5672"]
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://asian:postgres@localhost:5432/asian_restaurant
      REDIS_URL: redis://localhost:6379/1
      CART_REDIS_URL: redis://localhost:6379/0
      COMMANDS_MQ_URL_FOR_TRANSPORT: amqp://ci:ci@localhost:5672/
      REQUIRE_COMMAND_TRANSPORT_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  # the whole command lifecycle, lease/fencing, expiry and the dispatcher live here; without this
  # job their tests never run and a regression in operations reaches main green
  operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order_operations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops_user
          POSTGRES_PASSWORD: ops_pass
          POSTGRES_DB: operations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        # the bridge's retry guarantee is a broker behaviour, so it is asserted against a real one; the test waits for the port itself
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports: ["5672:5672"]
    env:
      OPERATIONS_SECRET_KEY: ci-ops-key
      OPERATIONS_DATABASE_URL: postgres://ops_user:ops_pass@localhost:5432/operations
      BRIDGE_MQ_URL_FOR_TRANSPORT: amqp://ci:ci@localhost:5672/
      REQUIRE_BRIDGE_TRANSPORT_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "../../packages/event_contracts[dev]"
      - run: pip install -r requirements.txt
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest tests/ -q

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/event_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: pytest -q

  security-config:
    # runs from the repo root (no working-directory), so scripts resolve compose files
    # and git paths correctly; ubuntu-latest ships Docker Compose v2 for the config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose version
      # the production render must never depend on a repo-root .env; guard against one being
      # committed or created before the config check runs
      - name: repo-root .env must be absent
        run: test ! -e .env
      - run: bash scripts/check_no_secrets.sh
      - run: bash scripts/check_prod_config.sh

  command-permissions:
    # the publisher credential is a security boundary, so its restrictions are asserted against a
    # real broker instead of being skipped when no broker is configured
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pika pytest
      - name: start a clean broker with the dev definitions
        run: |
          set -eu
          # a missing source is silently turned into an auto-created directory by the bind
          # mount, which boots the broker into a crash loop with no obvious cause
          for f in enabled_plugins rabbitmq.conf definitions.dev.json; do
            test -f "ops/rabbitmq/$f" || { echo "::error::missing ops/rabbitmq/$f"; exit 1; }
          done
          start_broker() {
            # -v drops the anonymous data volume the image declares, so a retry starts
            # from an empty data dir instead of the wreckage of the previous attempt
            docker rm -fv rabbit >/dev/null 2>&1 || true
            docker run -d --name rabbit \
              -p 5672:5672 \
              -v "$PWD/ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro" \
              -v "$PWD/ops/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
              -v "$PWD/ops/rabbitmq/definitions.dev.json:/etc/rabbitmq/definitions.json:ro" \
              rabbitmq:4.3-management-alpine
            for _ in $(seq 1 60); do
              # a dead container has to be reported at once: waiting out the whole timeout
              # only to fail on "is not running" throws the reason away
              if [ "$(docker inspect -f '{{.State.Running}}' rabbit)" != "true" ]; then
                echo "the broker exited during startup"
                return 1
              fi
              # -u rabbitmq is load-bearing: docker exec defaults to root, HOME is the data
              # dir, and a cli started before the server has written .erlang.cookie creates
              # it root-owned and mode 400. the server runs as rabbitmq and then dies
              # reading its own cookie, so probing as root kills the broker it polls.
              # check_running, not ping: ping answers as soon as the erlang node is up and
              # lets the next step race the definitions import
              if docker exec -u rabbitmq rabbit rabbitmq-diagnostics -q check_running >/dev/null 2>&1; then
                return 0
              fi
              sleep 3
            done
            echo "the broker never finished starting"
            return 1
          }
          # one retry, with the log of every failed attempt: a flaky boot must not fail the
          # security gate, a broken one still has to
          for attempt in 1 2; do
            if start_broker; then exit 0; fi
            echo "::warning::broker startup attempt $attempt failed"
            docker logs rabbit || true
            sleep 5
          done
          echo "::error::the broker could not be started"
          exit 1

      - name: broker diagnostics
        if: failure()
        run: |
          docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' rabbit || true
          docker logs rabbit || true

      - name: converge permissions with the production provisioning script
        run: |
          docker exec -i \
            -e RABBITMQ_ADMIN_USER=asian -e RABBITMQ_ADMIN_PASSWORD=change-me-rabbit \
            -e STOREFRONT_MQ_PASSWORD=change-me-rabbit \
            -e OPERATIONS_MQ_PASSWORD=change-me-ops-mq \
            -e BRIDGE_MQ_PASSWORD=change-me-bridge-mq \
            -e OPERATIONS_COMMANDS_MQ_PASSWORD=change-me-commands-mq \
            rabbit bash -s < ops/rabbitmq/provision.sh
      - name: declare the command topology as its owner
        run: |
          PYTHONPATH=backend python -c "
          import pika
          from orders import command_messaging as cm
          conn = pika.BlockingConnection(pika.URLParameters('amqp://storefront_app:change-me-rabbit@localhost:5672/storefront'))
          cm.declare_topology(conn.channel())
          conn.close()
          "
      - name: publisher restrictions must hold
        env:
          COMMANDS_MQ_URL_FOR_PERMISSIONS: amqp://operations_commands:change-me-commands-mq@localhost:5672/storefront
          ADMIN_MQ_URL_FOR_PERMISSIONS: amqp://asian:change-me-rabbit@localhost:5672/storefront
          REQUIRE_COMMAND_PERMISSION_TESTS: "1"
        run: pytest services/order_operations/tests/test_command_permissions.py -q

  prod-bootstrap:
    # the release path for the broker: the one-shot rabbitmq-provision service against a bare broker from the production render, then the grants it has to leave behind
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prod_bootstrap_smoke.sh

  db-roles:
    # the production database roles: a storefront volume from before the split and a fresh operations volume, provisioned and migrated as a release does, then what the runtime role may and may not do
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db_roles_smoke.sh

  ops-pool:
    # the operations pool on the production render: a pool of one under a locked projection and a burst past the
    # worker's bound, answered only with 200 and neutral 503s, within the pool's connection and the pids limit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ops_pool_smoke.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
