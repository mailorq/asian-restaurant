# production storefront runtime: the base `env_file: [.env]` is reset per service below, so no
# container inherits a repo-root .env. Interpolation of ${VAR} below is a separate matter and
# does read .env when one is present, so the release procedure passes --env-file explicitly
# (see DEPLOY.md); every required value must be supplied there.
# application processes reach postgres as their runtime role (DML only); only the migration jobs use the migrator
x-storefront-runtime-dsn: &storefront-runtime-dsn postgres://storefront_runtime:${STOREFRONT_DB_RUNTIME_PASSWORD:?set STOREFRONT_DB_RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
x-operations-runtime-dsn: &operations-runtime-dsn postgres://operations_runtime:${OPERATIONS_DB_RUNTIME_PASSWORD:?set OPERATIONS_DB_RUNTIME_PASSWORD}@operations-db:5432/${OPERATIONS_DB_NAME:?set OPERATIONS_DB_NAME}

x-storefront-prod-env: &storefront-prod-env
  DJANGO_PRODUCTION: "1"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS (no wildcard)}
  DATABASE_URL: *storefront-runtime-dsn
  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  CART_REDIS_URL: ${CART_REDIS_URL:?set CART_REDIS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL}
  IDENTITY_JWT_KID: ${IDENTITY_JWT_KID:?set IDENTITY_JWT_KID (not the dev kid)}
  RATELIMIT_TRUST_XFF: "1"
  # TLS is terminated by an ingress in front of this stack, which must set X-Forwarded-Proto
  DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-1}
  # signing key is a read-only secret file, never inline (settings reject a non-empty inline key)
  IDENTITY_JWT_PRIVATE_KEY: ""
  IDENTITY_JWT_PRIVATE_KEY_FILE: /run/secrets/identity_jwt_private_key

secrets:
  # the signing key is a Docker secret sourced from an out-of-repo path (or an external
  # secret manager), mounted read-only at /run/secrets/identity_jwt_private_key
  identity_jwt_private_key:
    file: ${IDENTITY_JWT_KEY_FILE:?set IDENTITY_JWT_KEY_FILE to the key path}

services:
  db:
    # production must not fall back to blank/default database credentials
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  operations-db:
    # the base file falls back to dev bootstrap credentials; production must not
    environment:
      POSTGRES_DB: ${OPERATIONS_DB_NAME:?set OPERATIONS_DB_NAME}
      POSTGRES_USER: ${OPERATIONS_DB_USER:?set OPERATIONS_DB_USER}
      POSTGRES_PASSWORD: ${OPERATIONS_DB_PASSWORD:?set OPERATIONS_DB_PASSWORD}

  storefront-db-provision:
    environment:
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${STOREFRONT_DB_MIGRATOR_PASSWORD:?set STOREFRONT_DB_MIGRATOR_PASSWORD}
      DB_RUNTIME_PASSWORD: ${STOREFRONT_DB_RUNTIME_PASSWORD:?set STOREFRONT_DB_RUNTIME_PASSWORD}
      DB_PRODUCTION: "1"

  operations-db-provision:
    environment:
      PGDATABASE: ${OPERATIONS_DB_NAME:?set OPERATIONS_DB_NAME}
      PGUSER: ${OPERATIONS_DB_USER:?set OPERATIONS_DB_USER}
      PGPASSWORD: ${OPERATIONS_DB_PASSWORD:?set OPERATIONS_DB_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${OPERATIONS_DB_MIGRATOR_PASSWORD:?set OPERATIONS_DB_MIGRATOR_PASSWORD}
      DB_RUNTIME_PASSWORD: ${OPERATIONS_DB_RUNTIME_PASSWORD:?set OPERATIONS_DB_RUNTIME_PASSWORD}
      DB_PRODUCTION: "1"

  rabbitmq:
    # production must not load the dev template; !override drops the rabbitmq.conf and
    # definitions.dev.json mounts so load_definitions is off. Bootstrap a baseline admin,
    # then converge users/permissions with the rabbitmq-provision one-shot below.
    hostname: rabbitmq
    # do not publish the management UI to the host in production (reach it via a tunnel);
    # keeps 15672/15692 network-internal and avoids host-port clashes
    ports: !override []
    volumes: !override
      - rabbitmqdata:/var/lib/rabbitmq
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?set RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE}

  # release step before migrations and the runtime (DEPLOY.md), idempotent: creates vhosts, users and permissions
  rabbitmq-provision:
    image: rabbitmq:4.3-management-alpine@sha256:ce634665a8e7262384a793581c20cb8a46343887446eb391b77c814febeca4b2
    profiles: ["provision"]
    hostname: rabbitmq-provision
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_NODE: rabbit@rabbitmq
      RABBITMQ_MANAGEMENT_HOST: rabbitmq
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:?set RABBITMQ_ADMIN_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD}
      STOREFRONT_MQ_PASSWORD: ${STOREFRONT_MQ_PASSWORD:?set STOREFRONT_MQ_PASSWORD}
      OPERATIONS_MQ_PASSWORD: ${OPERATIONS_MQ_PASSWORD:?set OPERATIONS_MQ_PASSWORD}
      BRIDGE_MQ_PASSWORD: ${BRIDGE_MQ_PASSWORD:?set BRIDGE_MQ_PASSWORD}
      OPERATIONS_COMMANDS_MQ_PASSWORD: ${OPERATIONS_COMMANDS_MQ_PASSWORD:?set OPERATIONS_COMMANDS_MQ_PASSWORD}
    volumes:
      - ./ops/rabbitmq/provision.sh:/provision.sh:ro
    entrypoint: ["bash", "/provision.sh"]
    restart: "no"

  prometheus:
    ports: !override ["127.0.0.1:9090:9090"]

  frontend:
    # loopback only: an external ingress terminates TLS and forwards here. published on 0.0.0.0 this serves the login form over plain HTTP
    ports: !override ["127.0.0.1:80:80"]

  # migrations run as their own deployment step; the runtime services wait for them
  storefront-migrate:
    secrets:
      - identity_jwt_private_key
    env_file: !reset null
    environment:
      <<: *storefront-prod-env
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgres://storefront_migrator:${STOREFRONT_DB_MIGRATOR_PASSWORD:?set STOREFRONT_DB_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
    volumes: !override []

  operations-migrate:
    environment:
      OPERATIONS_PRODUCTION: "1"
      OPERATIONS_DEBUG: "0"
      RUN_MIGRATIONS: "1"
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:?set OPERATIONS_SECRET_KEY}
      OPERATIONS_ALLOWED_HOSTS: ${OPERATIONS_ALLOWED_HOSTS:?set OPERATIONS_ALLOWED_HOSTS}
      OPERATIONS_DATABASE_URL: postgres://operations_migrator:${OPERATIONS_DB_MIGRATOR_PASSWORD:?set OPERATIONS_DB_MIGRATOR_PASSWORD}@operations-db:5432/${OPERATIONS_DB_NAME:?set OPERATIONS_DB_NAME}

  backend:    # signing key is a read-only Docker secret file, never an env var; dev mount dropped and
    # base `env_file: [.env]` reset so the production render never depends on repo-root .env
    secrets:
      - identity_jwt_private_key
    env_file: !reset null
    environment: *storefront-prod-env
    volumes: !override
      - media:/app/media

  # transactional outbox relay is a storefront Django process: it starts under the same
  # production guard and needs the signing-key secret to satisfy the guard's key-file check
  relay:
    secrets:
      - identity_jwt_private_key
    env_file: !reset null
    environment: *storefront-prod-env

  # command consumer is a storefront Django process: same production guard and signing-key secret as the other two
  commands-consumer:
    secrets:
      - identity_jwt_private_key
    env_file: !reset null
    environment: *storefront-prod-env

  # legacy in-storefront projection consumer (RestaurantOrder). The independent operations
  # service now owns projections in its own database and nothing in the storefront reads
  # RestaurantOrder, so this parallel consumer is not run in production: it is gated behind a
  # profile production never activates, and its base `env_file: [.env]` is reset.
  ops:
    profiles: ["legacy-projection"]
    env_file: !reset null

  operations-api:
    environment:
      OPERATIONS_PRODUCTION: "1"
      OPERATIONS_DEBUG: "0"
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:?set OPERATIONS_SECRET_KEY}
      OPERATIONS_ALLOWED_HOSTS: ${OPERATIONS_ALLOWED_HOSTS:?set OPERATIONS_ALLOWED_HOSTS}
      OPERATIONS_DATABASE_URL: *operations-runtime-dsn
      OPERATIONS_RABBITMQ_URL: ${OPERATIONS_RABBITMQ_URL:?set OPERATIONS_RABBITMQ_URL}

  operations-consumer:
    environment:
      OPERATIONS_PRODUCTION: "1"
      OPERATIONS_DEBUG: "0"
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:?set OPERATIONS_SECRET_KEY}
      OPERATIONS_ALLOWED_HOSTS: ${OPERATIONS_ALLOWED_HOSTS:?set OPERATIONS_ALLOWED_HOSTS}
      OPERATIONS_DATABASE_URL: *operations-runtime-dsn
      OPERATIONS_RABBITMQ_URL: ${OPERATIONS_RABBITMQ_URL:?set OPERATIONS_RABBITMQ_URL}

  operations-bridge:
    environment:
      OPERATIONS_PRODUCTION: "1"
      OPERATIONS_DEBUG: "0"
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:?set OPERATIONS_SECRET_KEY}
      OPERATIONS_ALLOWED_HOSTS: ${OPERATIONS_ALLOWED_HOSTS:?set OPERATIONS_ALLOWED_HOSTS}
      OPERATIONS_DATABASE_URL: *operations-runtime-dsn
      OPERATIONS_BRIDGE_CONSUME_URL: ${OPERATIONS_BRIDGE_CONSUME_URL:?set OPERATIONS_BRIDGE_CONSUME_URL}
      OPERATIONS_BRIDGE_PUBLISH_URL: ${OPERATIONS_BRIDGE_PUBLISH_URL:?set OPERATIONS_BRIDGE_PUBLISH_URL}

  commands-relay:
    environment:
      OPERATIONS_PRODUCTION: "1"
      OPERATIONS_DEBUG: "0"
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:?set OPERATIONS_SECRET_KEY}
      OPERATIONS_ALLOWED_HOSTS: ${OPERATIONS_ALLOWED_HOSTS:?set OPERATIONS_ALLOWED_HOSTS}
      OPERATIONS_DATABASE_URL: *operations-runtime-dsn
      OPERATIONS_COMMANDS_RABBITMQ_URL: ${OPERATIONS_COMMANDS_RABBITMQ_URL:?set OPERATIONS_COMMANDS_RABBITMQ_URL}
      OPERATIONS_METRICS_PORT: "9103"
