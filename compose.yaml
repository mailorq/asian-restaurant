name: asian-restaurant

# application processes: read-only root filesystem, no capabilities, no privilege gain, bounded memory and processes
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - &tmp-mount /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  pids_limit: 64

# database roles, run as the bootstrap superuser before each migration job: the runtime role gets DML only and the migrator owns the schema objects
x-db-provision: &db-provision
  image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  user: "70:70"
  entrypoint: ["psql", "-X", "-q", "-f", "/provision.sql"]
  volumes:
    - ./ops/postgres/provision.sql:/provision.sql:ro
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 64m
  pids_limit: 16
  restart: "no"

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [storefront]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    networks: [cache]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:ce634665a8e7262384a793581c20cb8a46343887446eb391b77c814febeca4b2
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./ops/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./ops/rabbitmq/definitions.dev.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [broker_storefront, broker_operations, broker_admin, metrics_broker]
    restart: unless-stopped

  storefront-db-provision:
    <<: *db-provision
    networks: [storefront]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_MIGRATOR_ROLE: storefront_migrator
      DB_RUNTIME_ROLE: storefront_runtime
      DB_MIGRATOR_PASSWORD: ${STOREFRONT_DB_MIGRATOR_PASSWORD:-dev-storefront-migrator}
      DB_RUNTIME_PASSWORD: ${STOREFRONT_DB_RUNTIME_PASSWORD:-dev-storefront-runtime}
    depends_on:
      db:
        condition: service_healthy

  # migrations are a deployment step: one job per database, run to completion before anything else starts. every application image shares an entrypoint, so without this they would all migrate the same database at once on every rollout
  storefront-migrate:
    <<: *app-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: [.env]
    networks: [storefront]
    environment:
      RUN_MIGRATIONS: "1"
    command: ["true"]
    depends_on:
      storefront-db-provision:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"

  operations-db-provision:
    <<: *db-provision
    networks: [operations]
    environment:
      PGHOST: operations-db
      PGDATABASE: ${OPERATIONS_DB_NAME:-operations}
      PGUSER: ${OPERATIONS_DB_USER:-ops_user}
      PGPASSWORD: ${OPERATIONS_DB_PASSWORD:-ops_pass}
      DB_MIGRATOR_ROLE: operations_migrator
      DB_RUNTIME_ROLE: operations_runtime
      DB_MIGRATOR_PASSWORD: ${OPERATIONS_DB_MIGRATOR_PASSWORD:-dev-operations-migrator}
      DB_RUNTIME_PASSWORD: ${OPERATIONS_DB_RUNTIME_PASSWORD:-dev-operations-runtime}
    depends_on:
      operations-db:
        condition: service_healthy

  operations-migrate:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    networks: [operations]
    environment:
      RUN_MIGRATIONS: "1"
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
    command: ["true"]
    depends_on:
      operations-db-provision:
        condition: service_completed_successfully
      operations-db:
        condition: service_healthy
    restart: "no"

  # one-shot without network that hands the media volume to the runtime user 10001
  media-init:
    image: python:3.13-slim@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0
    user: "0:0"
    entrypoint: ["chown", "-R", "10001:10001", "/media"]
    network_mode: none
    read_only: true
    # DAC_READ_SEARCH walks directories the runtime user made unreadable to others
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 16
    volumes:
      - media:/media
    restart: "no"

  backend:
    <<: *app-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: [.env]
    networks: [edge, storefront, cache, broker_storefront, identity, metrics_storefront, egress_backend]
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      DJANGO_DB_POOL_MAX_SIZE: "8"
      IDENTITY_JWT_PRIVATE_KEY_FILE: /run/identity/jwt_private_key.pem
    tmpfs:
      - *tmp-mount
      - /tmp/prometheus:size=32m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    mem_limit: 1g
    # per worker: the requests in flight, each with its thread and the one that joins it, the event loop's default executor, and a handful of its own
    pids_limit: 768
    depends_on:
      storefront-migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - media:/app/media
      # local dev signing key (gitignored; run scripts/dev_gen_jwt_key.sh once);
      # production injects its own key via a secret and drops this mount (compose.prod.yaml)
      - ./ops/identity/jwt_private_key.pem:/run/identity/jwt_private_key.pem:ro
    expose:
      - "8000"          # internal only; reached over the compose network
    restart: unless-stopped

  # transactional outbox relay: publishes pending order events to RabbitMQ
  relay:
    <<: *app-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: [.env]
    command: python manage.py publish_outbox --loop
    networks: [storefront, broker_storefront, metrics_storefront]
    environment:
      OUTBOX_METRICS_PORT: "9104"
    expose:
      - "9104"
    depends_on:
      storefront-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ops runtime: consumes order events and builds the RestaurantOrder projection
  ops:
    <<: *app-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: [.env]
    command: python manage.py run_ops_consumer
    networks: [storefront, broker_storefront]
    depends_on:
      storefront-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # independent operations service (own DB, own credentials)
  operations-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [operations]
    environment:
      POSTGRES_DB: ${OPERATIONS_DB_NAME:-operations}
      POSTGRES_USER: ${OPERATIONS_DB_USER:-ops_user}
      POSTGRES_PASSWORD: ${OPERATIONS_DB_PASSWORD:-ops_pass}
    volumes:
      - operations_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  operations-api:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_RABBITMQ_URL: ${OPERATIONS_RABBITMQ_URL}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://backend:8000/api/auth/jwks}
      OPERATIONS_REDIS_URL: redis://operations-redis:6379/0
      OPERATIONS_DB_POOL_MAX_SIZE: "8"
      OPERATIONS_METRICS_PORT: "9105"
    networks: [operations, ops_limiter, identity, metrics_operations]
    # one worker, sized as for the backend
    pids_limit: 128
    depends_on:
      operations-migrate:
        condition: service_completed_successfully
      operations-redis:
        condition: service_healthy
      operations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "9000"
      - "9105"
    restart: unless-stopped

  operations-consumer:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    command: python manage.py run_operations_consumer
    networks: [operations, broker_operations, metrics_operations]
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_RABBITMQ_URL: ${OPERATIONS_RABBITMQ_URL}
      OPERATIONS_METRICS_PORT: "9101"
    expose:
      - "9101"
    depends_on:
      operations-migrate:
        condition: service_completed_successfully
      operations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      operations-api:
        condition: service_started
    restart: unless-stopped

  operations-bridge:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    command: python manage.py bridge_storefront_events
    networks: [operations, broker_operations]
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_BRIDGE_CONSUME_URL: ${OPERATIONS_BRIDGE_CONSUME_URL}
      OPERATIONS_BRIDGE_PUBLISH_URL: ${OPERATIONS_BRIDGE_PUBLISH_URL}
    depends_on:
      operations-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      operations-consumer:
        condition: service_started
    restart: unless-stopped

  commands-consumer:
    <<: *app-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: [.env]
    command: python manage.py consume_commands
    networks: [storefront, broker_storefront, metrics_storefront]
    environment:
      COMMANDS_METRICS_PORT: "9102"
    expose:
      - "9102"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:9102/metrics').read().decode())" | grep -qx 'commands_consumer_connected 1.0'
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      storefront-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  commands-relay:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    command: python manage.py publish_commands --loop
    networks: [operations, broker_operations, metrics_operations]
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_COMMANDS_RABBITMQ_URL: ${OPERATIONS_COMMANDS_RABBITMQ_URL:-}
      OPERATIONS_METRICS_PORT: "9103"
    expose:
      - "9103"
    depends_on:
      operations-migrate:
        condition: service_completed_successfully
      operations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      commands-consumer:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    <<: *app-hardening
    build:
      context: ./frontend
      target: prod
    # nginx itself holds under 5 mib in 3 processes; request bodies buffered in the /tmp tmpfs count toward this memory
    mem_limit: 128m
    pids_limit: 16
    networks: [public_frontend, edge]
    depends_on:
      - backend
    volumes:
      - media:/media:ro
    ports:
      - "80:8080"
    restart: unless-stopped

  # counters of the command limiter in operations-api and nothing else, so nothing is kept across a restart
  operations-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data:size=8m,uid=999,gid=1000,mode=0700,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    networks: [ops_limiter]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    # nobody, the owner the image gives /prometheus, so an existing tsdb volume keeps working; the volume is the only writable place
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [public_prometheus, metrics_storefront, metrics_operations, metrics_broker]
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

# one network per flow of the model in DEPLOY.md: membership connects every member with every other in both directions
networks:
  # the only three with a route out: two publish a port, the backend calls the geocoder
  public_frontend:
  public_prometheus:
  egress_backend:
  edge:
    internal: true
  storefront:
    internal: true
  cache:
    internal: true
  broker_storefront:
    internal: true
  broker_operations:
    internal: true
  broker_admin:
    internal: true
  operations:
    internal: true
  ops_limiter:
    internal: true
  identity:
    internal: true
  metrics_storefront:
    internal: true
  metrics_operations:
    internal: true
  metrics_broker:
    internal: true

volumes:
  pgdata:
  media:
  promdata:
  rabbitmqdata:
  redis_data:
  operations_pgdata:
