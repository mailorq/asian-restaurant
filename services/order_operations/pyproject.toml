[project]
name = "order-operations"
version = "0.1.0"
description = "Independent operations service: read models + command bus for restaurant staff."
requires-python = ">=3.13"
# the one list to edit; uv.lock pins everything these pull in, with hashes
dependencies = [
    "Django==5.2.17",
    "django-ninja==1.7.0",
    "django-environ==0.14.0",
    "psycopg[binary,pool]==3.3.4",
    "psycopg-pool==3.3.1",
    "pika==1.4.4",
    "redis==8.0.1",
    "prometheus-client==0.26.0",
    "PyJWT[crypto]==2.13.0",
    "gunicorn==26.2.0",
    "uvicorn[standard]==0.52.4",
    "event-contracts",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.uv.sources]
event-contracts = { path = "../../packages/event_contracts" }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"
