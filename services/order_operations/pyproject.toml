[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-operations"
version = "0.1.0"
description = "Independent operations service: read models + command bus for restaurant staff."
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "django-ninja>=1.3",
    "psycopg[binary,pool]>=3.2",
    "django-environ>=0.11",
    "pika>=1.3",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-django>=4.9", "ruff>=0.6"]

[tool.setuptools]
packages = ["config", "operations"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"
