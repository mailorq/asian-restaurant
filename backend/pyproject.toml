[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asian-restaurant"
version = "0.1.0"
description = "Asian Restaurant"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "django-ninja>=1.3",
    "psycopg[binary,pool]>=3.2",
    "django-environ>=0.11",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.30",
    "whitenoise>=6.7",
    "redis>=5.0",
    "pika>=1.3",
    "httpx>=0.27",
    "django-prometheus>=2.3",
    "phonenumbers>=8.13",
    "Pillow>=10.4",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
]

[tool.setuptools]
packages = ["config", "accounts", "menu", "orders", "cart", "common", "employee", "ops"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**", "seed/products_data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# line length is enforced by the formatter, not the linter
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"
