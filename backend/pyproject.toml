[project]
name = "asian-restaurant"
version = "0.1.0"
description = "Asian Restaurant"
requires-python = ">=3.13"
# the one list to edit; uv.lock pins everything these pull in, with hashes
dependencies = [
    "Django==5.2.17",
    "django-ninja==1.7.0",
    "pydantic==2.13.5",
    "psycopg[binary,pool]==3.3.4",
    "psycopg-pool==3.3.1",
    "django-environ==0.14.0",
    "redis==8.0.1",
    "pika==1.4.4",
    "httpx==0.28.1",
    "gunicorn==26.0.0",
    "uvicorn[standard]==0.39.0",
    "whitenoise==6.12.0",
    "django-prometheus==2.5.0",
    "phonenumbers==9.0.34",
    "Pillow==12.3.0",
    "PyJWT[crypto]==2.13.0",
    "event-contracts",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.15.22",
    "mypy==2.3.0",
    "django-stubs==6.0.7",
]

[tool.uv]
# the app runs from its source tree, only its dependencies are installed
package = false

[tool.uv.sources]
event-contracts = { path = "../packages/event_contracts" }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**", "seed/products_data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# line length is enforced by the formatter, not the linter
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"
