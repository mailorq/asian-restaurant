# uv builds this package itself, offline: a backend fetched from the index at build time would come without a hash
[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[project]
name = "event-contracts"
version = "0.1.0"
description = "Versioned event/command contracts shared across services (no Django, no ORM)."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "EXE002"]
