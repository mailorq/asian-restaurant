[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "event-contracts"
version = "0.1.0"
description = "Versioned event/command contracts shared across services (no Django, no ORM)."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["event_contracts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "EXE002"]
