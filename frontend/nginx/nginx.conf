# runs as 101 on a read only root: no user switch, and the pid and every temp path live in the /tmp tmpfs
# a fixed worker count keeps the process count inside the pids limit on any host
worker_processes  2;
error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # paths only: a query string carries what a search was for, a customer's phone or name
    map $request_uri $request_path {
        "~^(?<request_path_only>[^?]*)" $request_path_only;
    }
    map $http_referer $referer_path {
        default "";
        "~^(?<referer_path_only>[^?]*)" $referer_path_only;
    }
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                      '$status $body_bytes_sent "$referer_path" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
