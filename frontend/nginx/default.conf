# production SPA host: serves the Vite build and reverse proxies the backend
# the scheme the ingress reported, falling back to this hop's own when nothing is in front
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# a bucket per client address: enough for someone typing a password, not for spraying them
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed vite assets are immutable - cache them hard
    location /assets/ {
        include /etc/nginx/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # User-uploaded product images from the shared media volume
    location /media/ {
        include /etc/nginx/security_headers.conf;
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # backend: api, django admin, and django served static (admin assets via whitenoise)
    location /api/    { include /etc/nginx/security_headers.conf; proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    location /static/ { include /etc/nginx/security_headers.conf; proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    location /admin/  { include /etc/nginx/security_headers.conf; proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    # the admin password form is the one place a password is guessed against, and django does not rate limit it
    location = /admin/login/ {
        include /etc/nginx/security_headers.conf;
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # /metrics is deliberately not proxied. prometheus scrapes backend:8000 directly

    # SPA fallback - every other path resolves to the app shell
    location / {
        include /etc/nginx/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
