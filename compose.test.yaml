services:
  operations-api:
    build:
      target: dev
    environment:
      # the tests create their own database, which only the bootstrap superuser may
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      STOREFRONT_DSN_FOR_ISOLATION: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@db:5432/${POSTGRES_DB}
    volumes:
      - ./services/order_operations:/srv/services/order_operations
    # the isolation test reaches the storefront database to prove the operations credentials are refused there
    networks: [storefront]
    depends_on:
      db:
        condition: service_healthy
      operations-db:
        condition: service_healthy
