groups:
  - name: operations
    rules:
      - alert: OperationsConsumerDown
        expr: operations_consumer_connected == 0 or absent(operations_consumer_connected)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "operations consumer not connected to RabbitMQ"
          description: "operations_consumer_connected is 0/absent — the projection consumer is not consuming."

      - alert: OperationsDLQNotEmpty
        expr: rabbitmq_queue_messages{queue=~"operations.*dlq"} > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "poison events in an operations DLQ ({{ $labels.queue }})"
          description: "{{ $value }} message(s) in {{ $labels.queue }} — investigate rejected events."

      - alert: CommandDLQNotEmpty
        # the command queues live on the storefront vhost and do not match operations.*
        expr: rabbitmq_queue_messages{queue=~"commands[.].*dlq"} > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "poison commands in {{ $labels.queue }}"
          description: "{{ $value }} message(s) in {{ $labels.queue }}, order transitions are not being applied."

      - alert: StorefrontOutboxBacklog
        # the publish backoff caps at 300s, so anything past twice that is a backlog that is not draining rather than a retry in flight
        expr: outbox_oldest_pending_age_seconds > 600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "storefront events are not leaving the outbox"
          description: "oldest unsent event is {{ $value }}s old, counting only rows still worth retrying; projections and the command outcome path are stalled."

      - alert: StorefrontOutboxRowStuck
        # the relay never drops a domain event, so this row retries forever. it is excluded from
        # the backlog age on purpose: left in, its age alone would hold that alert on and hide
        # every other pending row behind it
        expr: outbox_stuck_rows > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "storefront outbox rows are not publishable"
          description: "{{ $value }} row(s) past their attempt threshold, each holding back the later events of its aggregate; inspect with `manage.py outbox --list`."

      - alert: CommandConsumerDown
        expr: commands_consumer_connected == 0 or absent(commands_consumer_connected)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "command consumer not consuming"
          description: "no process is applying transition commands, so every command will time out."

      - alert: CommandOutboxBacklogStale
        # a backlog older than this is already producing timed_out commands rather than applied ones
        expr: operations_command_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "commands are not leaving the operations outbox"
          description: "oldest pending command is {{ $value }}s old; the relay or the storefront topology is down."

      - alert: CommandOutcomeBacklog
        # outcomes have their own queue precisely so they never wait behind projection traffic; anything still queued after a minute is eating into a deadline it cannot get back
        expr: rabbitmq_queue_messages{queue="operations.outcomes"} > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "command outcomes are not being consumed"
          description: "{{ $value }} outcome(s) waiting; commands the storefront already applied are being marked timed_out."

      - alert: CommandInvalidPayload
        # a row that can never form a valid event is closed at once and never retried, so this is the only signal that one existed
        expr: increase(operations_command_dispatch_total{result="invalid"}[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "a command could not be encoded as a valid event"
          description: "{{ $value }} command(s) quarantined; the stored payload does not satisfy the contract."

      - alert: CommandUndeliverable
        # the broker returned every attempt, so the command was answered locally rather than applied: the exchange or binding the relay publishes to is missing
        expr: increase(operations_command_dispatch_total{result="undeliverable"}[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "commands are being closed as undeliverable"
          description: "{{ $value }} command(s) never reached a queue; the command exchange or its binding is missing."

      - alert: CommandDispatchAbandoned
        # the row is terminal and nothing will republish it, so the command can only be closed
        # by an outcome that may never come
        expr: increase(operations_command_dispatch_total{result="abandoned"}[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "a command exhausted its publish attempts"
          description: "{{ $value }} command(s) abandoned by the relay, delivery unknown, reconcile against the storefront."

      - alert: OperationsRetryQueueGrowing
        expr: rabbitmq_queue_messages{queue=~"operations.*retry"} > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "operations retry queue backing up ({{ $labels.queue }})"
          description: "{{ $value }} message(s) stuck in retry — a downstream dependency may be failing."

      - alert: OperationsConflictEvents
        # any conflict is a real fault (two events at one version) — separate from stale
        expr: increase(operations_projection_events_total{outcome="conflict"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "operations projection saw a version conflict"
          description: "Two distinct events claimed the same aggregate version — producer version drift."

      - alert: OperationsStaleEventsElevated
        # a single benign replay is one stale event; alert only on a sustained rate
        expr: increase(operations_projection_events_total{outcome="stale"}[15m]) > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "elevated stale event rate in operations projection"
          description: "More than 5 stale events in 15m sustained — likely reordered or duplicated delivery."
